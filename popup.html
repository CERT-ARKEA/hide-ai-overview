<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Bloqueur AI Overview</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      width: 260px;
      padding: 14px;
      margin: 0;
      color: #202124;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-top: 1px solid #eee;
    }
    .row:first-of-type {
      border-top: none;
    }
    label {
      font-size: 13px;
    }
    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
    }
    switch-input {
      cursor: pointer;
    }
    footer {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Bloqueur AI Overview / AI Mode</h1>

  <div class="row">
    <div>
      <label for="enabled">Masquage actif</label>
      <div class="hint">Cache l'AI Overview et l'onglet AI Mode</div>
    </div>
    <input type="checkbox" id="enabled" />
  </div>

  <div class="row">
    <div>
      <label for="strict">Mode strict (udm=14)</label>
      <div class="hint">Force la vue "Web" classique de Google</div>
    </div>
    <input type="checkbox" id="strict" />
  </div>

  <footer>Actualise l'onglet Google Search après un changement si besoin.</footer>

  <script src="popup.js"></script>
</body>
</html>
